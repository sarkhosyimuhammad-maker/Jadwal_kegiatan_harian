<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Sehat Ocean Blue & Soft Slate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar super tipis dengan aksen abu-abu kalem */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-stone-100 via-slate-50 to-blue-50/50 text-slate-800 min-h-screen py-3 px-2 sm:py-6 sm:px-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- Ornamen Latar Belakang Ocean Blue Lembut -->
    <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] bg-blue-500/5 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] bg-stone-500/5 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Main Card Container -->
    <div class="w-full max-w-xl bg-white rounded-2xl shadow-md border border-stone-200/60 relative z-10 overflow-hidden">
        
        <!-- Header Utama dengan Warna Solid Premium -->
        <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-700 text-white p-4 flex items-center gap-3 border-b-2 border-blue-800 shadow-sm">
            <div class="shrink-0 flex items-center justify-center p-2 bg-white/10 border border-white/20 rounded-xl shadow-inner">
                <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
                    <path d="M12 3C7.5 3 4 6.5 4 11c0 4.5 4.5 9 8 10 3.5-1 8-5.5 8-10 0-4.5-3.5-8-8-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8.5 11.5l2.5 2.5 4.5-4.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-tight leading-none">Jadwal-Ku</h1>
                <p class="text-[9px] text-blue-200 mt-1 uppercase tracking-widest font-extrabold">Senin s.d Minggu</p>
            </div>
        </header>

        <!-- Padding Container untuk Konten Utama -->
        <div class="p-4 space-y-3.5">
            
            <!-- Pesan Kotak Notifikasi Alarm Internal Aplikasi -->
            <div id="alarm-banner" class="hidden p-3 bg-blue-600 text-white rounded-xl shadow-md flex items-center justify-between animate-pulse">
                <div class="flex items-center gap-2">
                    <span class="text-lg">⏰</span>
                    <div>
                        <h4 class="font-extrabold text-xs uppercase tracking-wide">Waktunya Aktivitas Sehat!</h4>
                        <p id="alarm-banner-text" class="text-[11px] text-blue-100 mt-0.5"></p>
                    </div>
                </div>
                <button onclick="matikanAlarmInternal()" class="bg-white text-blue-800 hover:bg-stone-50 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all">
                    Selesai
                </button>
            </div>

            <!-- Navigasi Hari (Sistem Filter Mikro - Diposisikan di Tengah) -->
            <div class="flex gap-1 overflow-x-auto justify-center pb-2 border-b border-slate-100" id="day-tabs">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>

            <!-- Form Tambah/Edit Kegiatan & Fitur Manajemen Penggandaan/Penghapusan -->
            <details id="form-details" class="group bg-stone-50 rounded-xl border border-stone-200/60">
                <summary class="list-none flex justify-between items-center p-2.5 font-bold text-[10px] uppercase tracking-wider text-stone-700 cursor-pointer select-none">
                    <span id="form-title-label">+ Tambah / Kustomisasi / Kelola Jadwal</span>
                    <span class="transition-transform group-open:rotate-180 text-stone-500 text-[8px]">▼</span>
                </summary>
                
                <div class="p-3 pt-0 border-t border-stone-200/40 space-y-4">
                    <!-- Sesi Form Input Kegiatan -->
                    <form id="schedule-form" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Hari</label>
                                <select id="task-day" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-500 transition-all">
                                    <option value="Senin">Senin</option>
                                    <option value="Selasa">Selasa</option>
                                    <option value="Rabu">Rabu</option>
                                    <option value="Kamis">Kamis</option>
                                    <option value="Jumat">Jumat</option>
                                    <option value="Sabtu">Sabtu</option>
                                    <option value="Minggu">Minggu</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Kategori</label>
                                <select id="task-category" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-500 transition-all">
                                    <option value="tidur">🛌 Istirahat</option>
                                    <option value="makan">🍲 Nutrisi Sehat</option>
                                    <option value="kerja">💼 Kerja/Studi</option>
                                    <option value="olahraga">🏋️‍♂️ Olahraga</option>
                                    <option value="obat">💊 Minum Obat</option>
                                    <option value="hidrasi">💧 Air Minum</option>
                                    <option value="metime">🧘 Me-Time / Santai</option>
                                    <option value="lainnya">🌟 Rutinitas</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Nama Aktivitas</label>
                            <input type="text" id="task-name" required placeholder="Contoh: Minum Obat Darah Tinggi Ibu..." 
                                class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 transition-all">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Mulai</label>
                                <input type="time" id="task-start" required class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 transition-all">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Selesai</label>
                                <input type="time" id="task-end" required class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 transition-all">
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button type="button" id="cancel-edit-btn" onclick="batalEdit()" class="hidden w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2 rounded-lg text-xs transition-all">
                                Batal
                            </button>
                            <button type="submit" id="submit-btn" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-semibold py-2 rounded-lg text-xs transition-all shadow-sm">
                                Tambahkan ke Agenda
                        </button>
                        </div>
                    </form>

                    <!-- Sesi Fitur Salin Jadwal Massal & Tombol Pengosongan Instan -->
                    <div class="pt-3 border-t border-stone-200/60 space-y-2.5">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-1">📋 Salin Seluruh Jadwal Dari Hari Lain</label>
                            <div class="flex gap-2">
                                <select id="copy-from-day" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-500 transition-all">
                                    <option value="Senin">Senin</option>
                                    <option value="Selasa">Selasa</option>
                                    <option value="Rabu">Rabu</option>
                                    <option value="Kamis">Kamis</option>
                                    <option value="Jumat">Jumat</option>
                                    <option value="Sabtu">Sabtu</option>
                                    <option value="Minggu">Minggu</option>
                                </select>
                                <button type="button" onclick="eksekusiSalinJadwal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition-all shrink-0 shadow-sm whitespace-nowrap">
                                    Salin Jadwal
                                </button>
                            </div>
                        </div>

                        <!-- Tombol Kosongkan Hari Ini Sekali Klik -->
                        <button type="button" onclick="kosongkanHariAktif()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200/80 font-bold py-2 rounded-lg text-xs transition-all shadow-sm flex items-center justify-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            Kosongkan Seluruh Jadwal Hari <span id="clear-day-name" class="underline">Senin</span>
                        </button>
                        
                        <p id="copy-status-msg" class="text-[9px] mt-1.5 hidden font-medium"></p>
                    </div>
                </div>
            </details>

            <!-- Agenda Section -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center border-b border-stone-100 pb-1.5">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                        Agenda Hari <span id="active-day-label" class="text-blue-600 font-extrabold">Senin</span>
                    </h2>
                    <span id="task-count" class="text-[10px] font-bold bg-stone-100 text-stone-700 border border-stone-200 px-2 py-0.5 rounded-full">0 Kegiatan</span>
                </div>
                
                <!-- List Agenda Container (Tampilan Kompak dengan Gulir Mulus) -->
                <div id="task-list" class="space-y-2 max-h-[65vh] overflow-y-auto pr-0.5">
                    <!-- Javascript Injection -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Palet warna kategori aktivitas dengan penanda border-2 tebal (Tebal garis pembatas disesuaikan sesuai instruksi)
        const THEME_CONFIG = {
            tidur: { bg: 'bg-slate-50/90', border: 'border-slate-300', text: 'text-slate-600', bgBadge: 'bg-slate-200/70', label: '🛌 Istirahat' },
            makan: { bg: 'bg-blue-50/70', border: 'border-blue-300', text: 'text-blue-600', bgBadge: 'bg-blue-100', label: '🍲 Nutrisi' },
            kerja: { bg: 'bg-stone-50/80', border: 'border-stone-300', text: 'text-stone-700', bgBadge: 'bg-stone-200/80', label: '💼 Kerja' },
            olahraga: { bg: 'bg-cyan-50/70', border: 'border-cyan-300', text: 'text-cyan-600', bgBadge: 'bg-cyan-100', label: '🏋️‍♂️ Olahraga' },
            obat: { bg: 'bg-rose-50/80', border: 'border-rose-300', text: 'text-rose-600', bgBadge: 'bg-rose-100', label: '💊 Obat/Suplemen' },
            hidrasi: { bg: 'bg-indigo-50/70', border: 'border-indigo-300', text: 'text-indigo-600', bgBadge: 'bg-indigo-100', label: '💧 Air Minum' },
            metime: { bg: 'bg-amber-50/70', border: 'border-amber-300', text: 'text-amber-600', bgBadge: 'bg-amber-100', label: '🧘 Me-Time' },
            lainnya: { bg: 'bg-zinc-50/90', border: 'border-zinc-300', text: 'text-zinc-600', bgBadge: 'bg-zinc-200/60', label: '🌟 Rutin' }
        };

        const HARI_URUTAN = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        let selectedDay = 'Senin';
        let editIndex = -1;

        const DEFAULT_SCHEDULE = [];
        
        // Template Rutinitas Sehat Senin - Jumat
        HARI_URUTAN.slice(0, 5).forEach(hari => {
            DEFAULT_SCHEDULE.push(
                { day: hari, name: 'Bangun Tidur & Sholat Subuh', start: '05:00', end: '05:30', category: 'lainnya', alarmActive: true },
                { day: hari, name: 'Minum Air Putih Pagi (Hidrasi Awal Tubuh)', start: '05:35', end: '05:45', category: 'hidrasi', alarmActive: true },
                { day: hari, name: 'Sarapan Sehat (Oatmeal + Pisang / Roti Gandum + Telur Rebus)', start: '06:30', end: '07:00', category: 'makan', alarmActive: true },
                { day: hari, name: 'Jadwal Minum Obat / Vitamin Pagi Ibu', start: '07:15', end: '07:25', category: 'obat', alarmActive: true },
                { day: hari, name: 'Mulai Kerja / Aktivitas Pagi', start: '08:00', end: '09:30', category: 'kerja', alarmActive: true },
                { day: hari, name: 'Waktu Terbaik Ngopi Pagi (Kadar Kortisol Menurun)', start: '09:30', end: '10:00', category: 'makan', alarmActive: true },
                { day: hari, name: 'Melanjutkan Kerja Produktif', start: '10:00', end: '12:00', category: 'kerja', alarmActive: true },
                { day: hari, name: 'Istirahat & Makan Siang Sehat (Dada Ayam + Nasi Merah + Sayur)', start: '12:00', end: '13:00', category: 'makan', alarmActive: true },
                { day: hari, name: 'Kerja Sesi Siang', start: '13:00', end: '16:00', category: 'kerja', alarmActive: true },
                { day: hari, name: 'Olahraga Sore (Jogging / Kardio / Workout)', start: '16:30', end: '17:30', category: 'olahraga', alarmActive: true },
                { day: hari, name: 'Makan Malam Terakhir (Maksimal Jam 19.00 - Rendah Karbo)', start: '18:30', end: '19:00', category: 'makan', alarmActive: true },
                { day: hari, name: 'Jadwal Minum Obat Malam Ibu', start: '19:15', end: '19:25', category: 'obat', alarmActive: true },
                { day: hari, name: 'Me-Time / Bersantai dengan Keluarga / Main Game / Musik', start: '19:30', end: '21:30', category: 'metime', alarmActive: true },
                { day: hari, name: 'Tidur Malam Baik (Siklus Istirahat Berbobot)', start: '22:00', end: '05:00', category: 'tidur', alarmActive: true }
            );
        });

        // Sabtu - Minggu
        ['Sabtu', 'Minggu'].forEach(hari => {
            DEFAULT_SCHEDULE.push(
                { day: hari, name: 'Bangun Pagi & Sholat Subuh', start: '05:00', end: '05:30', category: 'lainnya', alarmActive: true },
                { day: hari, name: 'Sarapan Pagi (Makan Bebas / Cheat Day Menu)', start: '07:35', end: '08:15', category: 'makan', alarmActive: true },
                { day: hari, name: 'Jadwal Minum Obat Pagi Ibu', start: '08:20', end: '08:30', category: 'obat', alarmActive: true },
                { day: hari, name: 'Waktu Bersantai / Hobi Akhir Pekan / Hiburan', start: '09:00', end: '12:00', category: 'metime', alarmActive: true },
                { day: hari, name: 'Makan Siang (Makan Bebas Kulineran)', start: '12:30', end: '13:30', category: 'makan', alarmActive: true },
                { day: hari, name: 'Olahraga Akhir Pekan (Tetap Jaga Kebugaran Tubuh)', start: '16:30', end: '17:45', category: 'olahraga', alarmActive: true },
                { day: hari, name: 'Makan Malam Bebas Bersama Keluarga', start: '19:00', end: '20:15', category: 'makan', alarmActive: true },
                { day: hari, name: 'Jadwal Minum Obat Malam Ibu', start: '20:20', end: '20:30', category: 'obat', alarmActive: true },
                { day: hari, name: 'Istirahat / Tidur Malam', start: '22:30', end: '05:00', category: 'tidur', alarmActive: true }
            );
        });

        let kegiatanList = JSON.parse(localStorage.getItem('weekly_healthy_orange_jadwal')) || DEFAULT_SCHEDULE;
        let audioCtx = null;
        let alarmIntervalId = null;
        let menitTerakhirDiperiksa = '';

        const form = document.getElementById('schedule-form');
        const listContainer = document.getElementById('task-list');
        const countBadge = document.getElementById('task-count');
        const alarmBanner = document.getElementById('alarm-banner');
        const alarmBannerText = document.getElementById('alarm-banner-text');
        const dayTabsContainer = document.getElementById('day-tabs');
        const activeDayLabel = document.getElementById('active-day-label');
        const clearDayName = document.getElementById('clear-day-name');
        const formDetails = document.getElementById('form-details');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const formTitleLabel = document.getElementById('form-title-label');

        function renderTabs() {
            dayTabsContainer.innerHTML = HARI_URUTAN.map(hari => {
                const isActive = hari === selectedDay;
                return `
                    <button onclick="switchDay('${hari}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all shrink-0 ${
                        isActive 
                        ? 'bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-sm' 
                        : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                    }">
                        ${hari}
                    </button>
                `;
            }).join('');
        }

        function switchDay(hari) {
            selectedDay = hari;
            activeDayLabel.innerText = hari;
            clearDayName.innerText = hari;
            renderTabs();
            renderJadwal();
            if (editIndex !== -1 && kegiatanList[editIndex].day !== selectedDay) {
                batalEdit();
            }
        }

        function bunyikanSuaraAlarm() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 120);
        }

        function mulaiLoopAlarmInternal() {
            if (alarmIntervalId) return;
            bunyikanSuaraAlarm();
            alarmIntervalId = setInterval(bunyikanSuaraAlarm, 900);
        }

        function matikanAlarmInternal() {
            if (alarmIntervalId) {
                clearInterval(alarmIntervalId);
                alarmIntervalId = null;
            }
            alarmBanner.classList.add('hidden');
        }

        function toggleAlarmAktivitas(originalIndex) {
            if (originalIndex > -1) {
                const item = kegiatanList[originalIndex];
                item.alarmActive = item.alarmActive !== false ? false : true;
                
                localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
                renderJadwal();

                if (!item.alarmActive) {
                    matikanAlarmInternal();
                }
            }
        }

        function cekWaktuOtomatis() {
            const Clinical_Time = new Date();
            const daftarHariIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const hariSekarang = daftarHariIndo[Clinical_Time.getDay()];
            
            const jam = String(Clinical_Time.getHours()).padStart(2, '0');
            const menit = String(Clinical_Time.getMinutes()).padStart(2, '0');
            const waktuSekarangString = `${jam}:${menit}`;

            if (waktuSekarangString === menitTerakhirDiperiksa) return;
            menitTerakhirDiperiksa = waktuSekarangString;

            const aktivitasSesuai = kegiatanList.find(item => 
                item.day === hariSekarang && 
                item.start === waktuSekarangString && 
                item.alarmActive !== false
            );

            if (aktivitasSesuai) {
                alarmBannerText.innerText = `[${aktivitasSesuai.day}] ${aktivitasSesuai.name} (${aktivitasSesuai.start})`;
                alarmBanner.classList.remove('hidden');
                mulaiLoopAlarmInternal();
            }
        }

        function eksekusiSalinJadwal() {
            const dariHari = document.getElementById('copy-from-day').value;
            const keHari = selectedDay;
            const statusMsg = document.getElementById('copy-status-msg');

            if (dariHari === keHari) {
                statusMsg.innerText = "⚠️ Hari asal dan hari tujuan tidak boleh sama!";
                statusMsg.className = "text-[9px] text-rose-600 mt-1.5 font-medium block";
                setTimeout(() => statusMsg.classList.add('hidden'), 3000);
                return;
            }

            const agendaAsal = kegiatanList.filter(item => item.day === dariHari);
            if (agendaAsal.length === 0) {
                statusMsg.innerText = `⚠️ Tidak ada kegiatan di hari ${dariHari} untuk disalin.`;
                statusMsg.className = "text-[9px] text-amber-600 mt-1.5 font-medium block";
                setTimeout(() => statusMsg.classList.add('hidden'), 3000);
                return;
            }

            kegiatanList = kegiatanList.filter(item => item.day !== keHari);

            agendaAsal.forEach(item => {
                kegiatanList.push({
                    day: keHari,
                    name: item.name,
                    start: item.start,
                    end: item.end,
                    category: item.category,
                    alarmActive: item.alarmActive !== false
                });
            });

            localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
            renderJadwal();

            statusMsg.innerText = `✅ Berhasil menyalin ${agendaAsal.length} kegiatan dari ${dariHari} ke ${keHari}!`;
            statusMsg.className = "text-[9px] text-blue-600 mt-1.5 font-bold block";
            setTimeout(() => statusMsg.classList.add('hidden'), 4000);
        }

        function kosongkanHariAktif() {
            const statusMsg = document.getElementById('copy-status-msg');
            const agendaHariIni = kegiatanList.filter(item => item.day === selectedDay);

            if (agendaHariIni.length === 0) {
                statusMsg.innerText = `⚠️ Jadwal hari ${selectedDay} memang sudah kosong.`;
                statusMsg.className = "text-[9px] text-amber-600 mt-1.5 font-medium block";
                setTimeout(() => statusMsg.classList.add('hidden'), 3000);
                return;
            }

            if (confirm(`Apakah Anda yakin ingin mengosongkan (menghapus) semua kegiatan di hari ${selectedDay}?`)) {
                if (editIndex !== -1 && kegiatanList[editIndex].day === selectedDay) {
                    batalEdit();
                }

                kegiatanList = kegiatanList.filter(item => item.day !== selectedDay);
                localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
                renderJadwal();

                statusMsg.innerText = `🗑️ Sukses! Seluruh jadwal hari ${selectedDay} telah dibersihkan.`;
                statusMsg.className = "text-[9px] text-rose-600 mt-1.5 font-bold block";
                setTimeout(() => statusMsg.classList.add('hidden'), 4000);
            }
        }

        function renderJadwal() {
            const filteredTasks = kegiatanList.filter(item => item.day === selectedDay);
            filteredTasks.sort((a, b) => a.start.localeCompare(b.start));
            
            countBadge.innerText = `${filteredTasks.length} Kegiatan`;

            if (filteredTasks.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs border border-dashed border-stone-200 rounded-xl bg-stone-50">
                        Belum ada jadwal untuk hari ${selectedDay}. Sila tambahkan baru atau salin dari hari lain.
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredTasks.map((item) => {
                const originalIndex = kegiatanList.findIndex(x => x.day === item.day && x.start === item.start && x.name === item.name);
                const config = THEME_CONFIG[item.category] || THEME_CONFIG.lainnya;
                const sedangDiedit = originalIndex === editIndex;
                const isAlarmActive = item.alarmActive !== false;

                // PEMBARUAN UTAMA: Menggunakan border-2 (lebih tebal), whitespace-normal & break-words agar teks tulisan lebih luas di HP
                return `
                    <div class="flex items-center justify-between p-2.5 ${config.bg} border-2 ${sedangDiedit ? 'border-blue-500 ring-2 ring-blue-500/20' : config.border} rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.01)] transition-all">
                        <div class="flex items-center gap-2.5 overflow-hidden w-full">
                            <div class="shrink-0 text-left min-w-[55px]">
                                <p class="text-[11px] font-bold text-slate-800">${item.start}</p>
                                <p class="text-[9px] font-medium text-slate-400">s/d ${item.end}</p>
                            </div>
                            <div class="w-[1.5px] h-6 bg-slate-200 shrink-0"></div>
                            
                            <!-- Kontainer Teks Luas: Menghilangkan truncate, menggunakan break-words agar pas & tidak tertutup di layar HP -->
                            <div class="overflow-hidden flex-1 min-w-0 pr-1">
                                <p class="text-xs font-bold text-slate-800 tracking-wide whitespace-normal break-words leading-tight">
                                    ${escapeHtml(item.name)}
                                </p>
                                <span class="inline-block text-[9px] font-extrabold px-1.5 py-0.2 mt-1 rounded ${config.bgBadge} ${config.text}">
                                    ${config.label} ${sedangDiedit ? '(Diedit)' : ''}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Panel Aksi Ringkas Tanpa Tombol Jam Android -->
                        <div class="flex items-center gap-0.5 shrink-0">
                            <button onclick="toggleAlarmAktivitas(${originalIndex})" class="p-1.5 rounded-md transition-all ${isAlarmActive ? 'text-blue-600 hover:bg-blue-50' : 'text-rose-500 hover:bg-rose-50'}" title="${isAlarmActive ? 'Klik untuk Senapkan (Silent) Alarm' : 'Klik untuk Aktifkan Alarm'}">
                                ${isAlarmActive ? 
                                    `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                                    </svg>` : 
                                    `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4L5.405 13.595C5.786 13.214 6 12.697 6 12.158V11c0-1.298.414-2.5 1.117-3.483M10 5.341V5a2 2 0 114 0v.341c.732.17 1.393.513 1.944.975M12 21a3 3 0 01-3-3h6a3 3 0 01-3 3zM3 3l18 18" />
                                    </svg>`
                                }
                            </button>
                            <button onclick="aktifkanModeEdit(${originalIndex})" class="text-slate-500 hover:text-blue-600 hover:bg-slate-50 p-1.5 rounded-md transition-all" title="Edit">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                </svg>
                            </button>
                            <button onclick="hapusJadwal(${originalIndex})" class="text-stone-300 hover:text-rose-600 hover:bg-slate-100 p-1.5 rounded-md transition-all" title="Hapus">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function aktifkanModeEdit(originalIndex) {
            editIndex = originalIndex;
            const item = kegiatanList[originalIndex];

            document.getElementById('task-day').value = item.day;
            document.getElementById('task-name').value = item.name;
            document.getElementById('task-start').value = item.start;
            document.getElementById('task-end').value = item.end;
            document.getElementById('task-category').value = item.category;

            formTitleLabel.innerText = "✍️ Edit / Ubah Kegiatan";
            submitBtn.innerText = "Simpan Perubahan";
            submitBtn.classList.replace('bg-stone-900', 'bg-blue-600');
            submitBtn.classList.replace('hover:bg-stone-800', 'hover:bg-blue-700');
            cancelEditBtn.classList.remove('hidden');

            formDetails.open = true;
            
            if (item.day !== selectedDay) {
                selectedDay = item.day;
                activeDayLabel.innerText = item.day;
                clearDayName.innerText = item.day;
                renderTabs();
            }
            renderJadwal();
        }

        function batalEdit() {
            editIndex = -1;
            form.reset();
            document.getElementById('task-day').value = selectedDay;

            formTitleLabel.innerText = "+ Tambah / Kustomisasi / Kelola Jadwal";
            submitBtn.innerText = "Tambahkan ke Agenda";
            submitBtn.classList.replace('bg-blue-600', 'bg-stone-900');
            submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-stone-800');
            cancelEditBtn.classList.add('hidden');
            
            renderJadwal();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const hari = document.getElementById('task-day').value;
            const nama = document.getElementById('task-name').value;
            const mulai = document.getElementById('task-start').value;
            const selesai = document.getElementById('task-end').value;
            const kategori = document.getElementById('task-category').value;

            const alarmActiveLama = editIndex !== -1 ? (kegiatanList[editIndex].alarmActive !== false) : true;

            const objekKegiatan = {
                day: hari,
                name: nama,
                start: mulai,
                end: selesai,
                category: kategori,
                alarmActive: alarmActiveLama
            };

            if (editIndex === -1) {
                kegiatanList.push(objekKegiatan);
            } else {
                kegiatanList[editIndex] = objekKegiatan;
                editIndex = -1;
            }

            localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
            form.reset();
            
            formTitleLabel.innerText = "+ Tambah / Kustomisasi / Kelola Jadwal";
            submitBtn.innerText = "Tambahkan ke Agenda";
            submitBtn.classList.replace('bg-blue-600', 'bg-stone-900');
            submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-stone-800');
            cancelEditBtn.classList.add('hidden');

            selectedDay = hari;
            activeDayLabel.innerText = hari;
            clearDayName.innerText = hari;
            
            renderTabs();
            renderJadwal();
        });

        function hapusJadwal(originalIndex) {
            if (originalIndex > -1) {
                if (editIndex === originalIndex) {
                    batalEdit();
                }
                kegiatanList.splice(originalIndex, 1);
                localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
                renderJadwal();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = function() {
            const waktuSekarang = new Date();
            const daftarHariIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const hariIniDeteksi = daftarHariIndo[waktuSekarang.getDay()];
            
            if (HARI_URUTAN.includes(hariIniDeteksi)) {
                selectedDay = hariIniDeteksi;
            }
            
            activeDayLabel.innerText = selectedDay;
            clearDayName.innerText = selectedDay;
            document.getElementById('task-day').value = selectedDay;

            renderTabs();
            renderJadwal();
            setInterval(cekWaktuOtomatis, 1000);
        };
    </script>
</body>
</html>
