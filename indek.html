<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Sehat Sage Green & Warm Stone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar super tipis dengan aksen abu-abu kalem */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-stone-100 via-slate-50 to-emerald-50/30 text-slate-800 min-h-screen py-3 px-2 sm:py-6 sm:px-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- Ornamen Latar Belakang Sage & Stone Lembut -->
    <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] bg-emerald-700/5 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] bg-stone-500/5 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Main Card Container -->
    <div class="w-full max-w-xl bg-white rounded-2xl shadow-md border border-stone-200/60 p-4 sm:p-6 relative z-10">
        
        <!-- Pesan Kotak Notifikasi Alarm Internal Aplikasi -->
        <div id="alarm-banner" class="hidden mb-3 p-3 bg-emerald-700 text-white rounded-xl shadow-md flex items-center justify-between animate-pulse">
            <div class="flex items-center gap-2">
                <span class="text-lg">⏰</span>
                <div>
                    <h4 class="font-extrabold text-xs uppercase tracking-wide">Waktunya Aktivitas Sehat!</h4>
                    <p id="alarm-banner-text" class="text-[11px] text-emerald-100 mt-0.5"></p>
                </div>
            </div>
            <button onclick="matikanAlarmInternal()" class="bg-white text-emerald-800 hover:bg-stone-50 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all">
                Selesai
            </button>
        </div>

        <!-- Header Utama (Tema Sage Green & Warm Stone dengan Logo Deep Teal & Soft Emerald yang Premium) -->
        <header class="text-center relative mb-3.5 flex items-center justify-center gap-2.5">
            <div class="p-1.5 bg-gradient-to-br from-teal-800 via-emerald-700 to-emerald-500 text-white rounded-xl shadow-md shadow-teal-900/10">
                <svg xmlns="http://www.w3.org/2000/xl" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
            </div>
            <div class="text-left">
                <h1 class="text-base font-extrabold text-slate-900 tracking-tight leading-none">Rencana Hidup Sehat</h1>
                <p class="text-[10px] text-emerald-700 mt-0.5 uppercase tracking-wider font-bold">7 Hari Mindful & Bugar (Sage & Stone)</p>
            </div>
        </header>

        <!-- Navigasi Hari (Sistem Filter Mikro - Diposisikan di Tengah) -->
        <div class="flex gap-1 overflow-x-auto justify-center pb-2 mb-3 border-b border-slate-100" id="day-tabs">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>

        <!-- Form Tambah/Edit Kegiatan (Sumbu Kustomisasi) -->
        <details id="form-details" class="group mb-3 bg-stone-50 rounded-xl border border-stone-200/60">
            <summary class="list-none flex justify-between items-center p-2.5 font-bold text-[10px] uppercase tracking-wider text-stone-700 cursor-pointer select-none">
                <span id="form-title-label">+ Tambah / Kustomisasi Kegiatan</span>
                <span class="transition-transform group-open:rotate-180 text-stone-500 text-[8px]">▼</span>
            </summary>
            <form id="schedule-form" class="space-y-3 p-3 pt-0 border-t border-stone-200/40">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Hari</label>
                        <select id="task-day" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-emerald-600 transition-all">
                            <option value="Senin">Senin</option>
                            <option value="Selasa">Selasa</option>
                            <option value="Rabu">Rabu</option>
                            <option value="Kamis">Kamis</option>
                            <option value="Jumat">Jumat</option>
                            <option value="Sabtu">Sabtu</option>
                            <option value="Minggu">Minggu</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Kategori</label>
                        <select id="task-category" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-emerald-600 transition-all">
                            <option value="tidur">🛌 Istirahat</option>
                            <option value="makan">🍲 Nutrisi Sehat</option>
                            <option value="kerja">💼 Kerja/Studi</option>
                            <option value="olahraga">🏋️‍♂️ Olahraga</option>
                            <option value="lainnya">🌟 Rutinitas</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Nama Aktivitas</label>
                    <input type="text" id="task-name" required placeholder="Nama kegiatan..." 
                        class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-600 transition-all">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Mulai</label>
                        <input type="time" id="task-start" required class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-600 transition-all">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Selesai</label>
                        <input type="time" id="task-end" required class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-600 transition-all">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="cancel-edit-btn" onclick="batalEdit()" class="hidden w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2 rounded-lg text-xs transition-all">
                        Batal
                    </button>
                    <button type="submit" id="submit-btn" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-semibold py-2 rounded-lg text-xs transition-all shadow-sm">
                        Tambahkan ke Agenda
                    </button>
                </div>
            </form>
        </details>

        <!-- Agenda Section -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center border-b border-stone-100 pb-1.5">
                <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
                    Agenda Hari <span id="active-day-label" class="text-emerald-700 font-extrabold">Senin</span>
                </h2>
                <span id="task-count" class="text-[10px] font-bold bg-stone-100 text-stone-700 border border-stone-200 px-2 py-0.5 rounded-full">0 Kegiatan</span>
            </div>
            
            <!-- List Agenda Container (Tampilan Kompak) -->
            <div id="task-list" class="space-y-1.5 max-h-[68vh] overflow-y-auto pr-0.5">
                <!-- Javascript Injection -->
            </div>
        </div>
    </div>

    <script>
        // Palet warna estetik Sage Green & Warm Stone yang ramah mata (gender-neutral)
        const THEME_CONFIG = {
            tidur: { bg: 'bg-slate-50/80', border: 'border-slate-200/50', text: 'text-slate-600', bgBadge: 'bg-slate-200/60', label: '🛌 Tidur' },
            makan: { bg: 'bg-emerald-50/40', border: 'border-emerald-200/40', text: 'text-emerald-800', bgBadge: 'bg-emerald-100/70', label: '🍲 Nutrisi' },
            kerja: { bg: 'bg-stone-50/60', border: 'border-stone-200/40', text: 'text-stone-700', bgBadge: 'bg-stone-200/70', label: '💼 Kerja' },
            olahraga: { bg: 'bg-green-50/40', border: 'border-green-200/40', text: 'text-green-800', bgBadge: 'bg-green-100/70', label: '🏋️‍♂️ Olahraga' },
            lainnya: { bg: 'bg-zinc-50', border: 'border-zinc-200/60', text: 'text-zinc-600', bgBadge: 'bg-zinc-200/50', label: '🌟 Rutin' }
        };

        const HARI_URUTAN = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        let selectedDay = 'Senin';
        let editIndex = -1;

        const DEFAULT_SCHEDULE = [];
        
        // Pola Hidup Sehat Senin - Jumat
        HARI_URUTAN.slice(0, 5).forEach(hari => {
            DEFAULT_SCHEDULE.push(
                { day: hari, name: 'Bangun Tidur & Sholat Subuh', start: '05:00', end: '05:30', category: 'lainnya' },
                { day: hari, name: 'Sarapan Sehat (Oatmeal + Pisang / Roti Gandum + Telur Rebus)', start: '06:30', end: '07:00', category: 'makan' },
                { day: hari, name: 'Mulai Kerja / Aktivitas Pagi', start: '08:00', end: '09:30', category: 'kerja' },
                { day: hari, name: 'Waktu Terbaik Ngopi Pagi (Kadar Kortisol Menurun)', start: '09:30', end: '10:00', category: 'makan' },
                { day: hari, name: 'Melanjutkan Kerja Produktif', start: '10:00', end: '12:00', category: 'kerja' },
                { day: hari, name: 'Istirahat & Makan Siang Sehat (Dada Ayam + Nasi Merah + Sayur)', start: '12:00', end: '13:00', category: 'makan' },
                { day: hari, name: 'Kerja Sesi Siang', start: '13:00', end: '16:00', category: 'kerja' },
                { day: hari, name: 'Olahraga Sore (Jogging / Kardio / Workout)', start: '16:30', end: '17:30', category: 'olahraga' },
                { day: hari, name: 'Makan Malam Terakhir (Maksimal Jam 19.00 - Rendah Karbo)', start: '18:30', end: '19:00', category: 'makan' },
                { day: hari, name: 'Bercengkrama Bersama Keluarga / Tugas Mandiri', start: '19:30', end: '21:30', category: 'lainnya' },
                { day: hari, name: 'Tidur Malam Baik (Siklus Istirahat Berbobot)', start: '22:00', end: '05:00', category: 'tidur' }
            );
        });

        // Pola Hidup Sehat Fleksibel (Sabtu - Minggu)
        ['Sabtu', 'Minggu'].forEach(hari => {
            DEFAULT_SCHEDULE.push(
                { day: hari, name: 'Bangun Pagi & Sholat Subuh', start: '05:00', end: '05:30', category: 'lainnya' },
                { day: hari, name: 'Sarapan Pagi (Makan Bebas / Cheat Day Menu)', start: '07:35', end: '08:15', category: 'makan' },
                { day: hari, name: 'Waktu Bersantai / Hobi Akhir Pekan', start: '09:00', end: '12:00', category: 'lainnya' },
                { day: hari, name: 'Makan Siang (Makan Bebas Kulineran)', start: '12:30', end: '13:30', category: 'makan' },
                { day: hari, name: 'Olahraga Akhir Pekan (Tetap Jaga Kebugaran Tubuh)', start: '16:30', end: '17:45', category: 'olahraga' },
                { day: hari, name: 'Makan Malam Bebas Bersama Keluarga', start: '19:00', end: '20:15', category: 'makan' },
                { day: hari, name: 'Istirahat / Tidur Malam', start: '22:30', end: '05:00', category: 'tidur' }
            );
        });

        let kegiatanList = JSON.parse(localStorage.getItem('weekly_healthy_orange_jadwal')) || DEFAULT_SCHEDULE;
        let audioCtx = null;
        let alarmIntervalId = null;
        let menitTerakhirDiperiksa = '';

        const form = document.getElementById('schedule-form');
        const listContainer = document.getElementById('task-list');
        const countBadge = document.getElementById('task-count');
        const alarmBanner = document.getElementById('alarm-banner');
        const alarmBannerText = document.getElementById('alarm-banner-text');
        const dayTabsContainer = document.getElementById('day-tabs');
        const activeDayLabel = document.getElementById('active-day-label');
        const formDetails = document.getElementById('form-details');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const formTitleLabel = document.getElementById('form-title-label');

        function renderTabs() {
            dayTabsContainer.innerHTML = HARI_URUTAN.map(hari => {
                const isActive = hari === selectedDay;
                return `
                    <button onclick="switchDay('${hari}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all shrink-0 ${
                        isActive 
                        ? 'bg-gradient-to-r from-emerald-600 to-stone-600 text-white shadow-sm' 
                        : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                    }">
                        ${hari}
                    </button>
                `;
            }).join('');
        }

        function switchDay(hari) {
            selectedDay = hari;
            activeDayLabel.innerText = hari;
            renderTabs();
            renderJadwal();
            if (editIndex !== -1 && kegiatanList[editIndex].day !== selectedDay) {
                batalEdit();
            }
        }

        function bunyikanSuaraAlarm() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 120);
        }

        function mulaiLoopAlarmInternal() {
            if (alarmIntervalId) return;
            bunyikanSuaraAlarm();
            alarmIntervalId = setInterval(bunyikanSuaraAlarm, 900);
        }

        function matikanAlarmInternal() {
            if (alarmIntervalId) {
                clearInterval(alarmIntervalId);
                alarmIntervalId = null;
            }
            alarmBanner.classList.add('hidden');
        }

        function setAndroidAlarm(waktuMulai, namaAktivitas) {
            const [jam, menit] = waktuMulai.split(':').map(Number);
            const intentUrl = `intent://#Intent;action=android.intent.action.SET_ALARM;i:android.intent.extra.alarm.HOUR=${jam};i:android.intent.extra.alarm.MINUTES=${menit};S:android.intent.extra.alarm.MESSAGE=${encodeURIComponent(namaAktivitas)};B:android.intent.extra.alarm.SKIP_UI=false;end`;
            window.location.href = intentUrl;
        }

        function cekWaktuOtomatis() {
            const Clinical_Time = new Date();
            const daftarHariIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const hariSekarang = daftarHariIndo[Clinical_Time.getDay()];
            
            const jam = String(Clinical_Time.getHours()).padStart(2, '0');
            const menit = String(Clinical_Time.getMinutes()).padStart(2, '0');
            const waktuSekarangString = `${jam}:${menit}`;

            if (waktuSekarangString === menitTerakhirDiperiksa) return;
            menitTerakhirDiperiksa = waktuSekarangString;

            const aktivitasSesuai = kegiatanList.find(item => item.day === hariSekarang && item.start === waktuSekarangString);
            if (aktivitasSesuai) {
                alarmBannerText.innerText = `[${aktivitasSesuai.day}] ${aktivitasSesuai.name} (${aktivitasSesuai.start})`;
                alarmBanner.classList.remove('hidden');
                mulaiLoopAlarmInternal();
            }
        }

        function renderJadwal() {
            const filteredTasks = kegiatanList.filter(item => item.day === selectedDay);
            filteredTasks.sort((a, b) => a.start.localeCompare(b.start));
            
            countBadge.innerText = `${filteredTasks.length} Kegiatan`;

            if (filteredTasks.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs border border-dashed border-stone-200 rounded-xl bg-stone-50">
                        Belum ada jadwal kustom untuk hari ${selectedDay}.
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredTasks.map((item) => {
                const originalIndex = kegiatanList.findIndex(x => x.day === item.day && x.start === item.start && x.name === item.name);
                const config = THEME_CONFIG[item.category] || THEME_CONFIG.lainnya;
                const sedangDiedit = originalIndex === editIndex;

                return `
                    <div class="flex items-center justify-between p-2.5 ${config.bg} border ${sedangDiedit ? 'border-emerald-600 ring-2 ring-emerald-600/20' : config.border} rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.01)] transition-all">
                        <div class="flex items-center gap-2 overflow-hidden w-full">
                            <!-- Indikator Waktu -->
                            <div class="shrink-0 text-left min-w-[70px]">
                                <p class="text-[11px] font-bold text-slate-800">${item.start}</p>
                                <p class="text-[9px] font-medium text-slate-400">s/d ${item.end}</p>
                            </div>
                            
                            <!-- Pembatas Vertikal -->
                            <div class="w-[2px] h-6 bg-slate-200 shrink-0"></div>
                            
                            <!-- Konten Utama -->
                            <div class="overflow-hidden pr-2">
                                <p class="text-xs font-bold text-slate-800 truncate tracking-wide" title="${escapeHtml(item.name)}">
                                    ${escapeHtml(item.name)}
                                </p>
                                <span class="inline-block text-[9px] font-extrabold px-1.5 py-0.2 mt-0.5 rounded ${config.bgBadge} ${config.text}">
                                    ${config.label} ${sedangDiedit ? '(Sedang Diedit)' : ''}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Panel Kontrol Aksi -->
                        <div class="flex items-center gap-0.5 shrink-0">
                            <!-- Tombol Edit -->
                            <button onclick="aktifkanModeEdit(${originalIndex})" 
                                class="text-emerald-700 hover:bg-emerald-50 p-1.5 rounded-md transition-all" 
                                title="Edit Kegiatan">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                </svg>
                            </button>
                            <!-- Tombol Alarm HP -->
                            <button onclick="setAndroidAlarm('${item.start}', '${escapeHtml(item.name)}')" 
                                class="text-stone-600 hover:bg-stone-100 p-1.5 rounded-md transition-all" 
                                title="Setel Alarm HP Android">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                                </svg>
                            </button>
                            <!-- Tombol Hapus -->
                            <button onclick="hapusJadwal(${originalIndex})" 
                                class="text-stone-300 hover:text-rose-600 hover:bg-slate-100 p-1.5 rounded-md transition-all"
                                title="Hapus">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function aktifkanModeEdit(originalIndex) {
            editIndex = originalIndex;
            const item = kegiatanList[originalIndex];

            document.getElementById('task-day').value = item.day;
            document.getElementById('task-name').value = item.name;
            document.getElementById('task-start').value = item.start;
            document.getElementById('task-end').value = item.end;
            document.getElementById('task-category').value = item.category;

            formTitleLabel.innerText = "✍️ Edit / Ubah Kegiatan";
            submitBtn.innerText = "Simpan Perubahan";
            submitBtn.classList.replace('bg-stone-900', 'bg-emerald-700');
            submitBtn.classList.replace('hover:bg-stone-800', 'hover:bg-emerald-800');
            cancelEditBtn.classList.remove('hidden');

            formDetails.open = true;
            
            if (item.day !== selectedDay) {
                selectedDay = item.day;
                activeDayLabel.innerText = item.day;
                renderTabs();
            }
            renderJadwal();
        }

        function batalEdit() {
            editIndex = -1;
            form.reset();
            document.getElementById('task-day').value = selectedDay;

            formTitleLabel.innerText = "+ Tambah / Kustomisasi Kegiatan";
            submitBtn.innerText = "Tambahkan ke Agenda";
            submitBtn.classList.replace('bg-emerald-700', 'bg-stone-900');
            submitBtn.classList.replace('hover:bg-emerald-800', 'hover:bg-stone-800');
            cancelEditBtn.classList.add('hidden');
            
            renderJadwal();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const hari = document.getElementById('task-day').value;
            const nama = document.getElementById('task-name').value;
            const mulai = document.getElementById('task-start').value;
            const selesai = document.getElementById('task-end').value;
            const kategori = document.getElementById('task-category').value;

            const objekKegiatan = {
                day: hari,
                name: nama,
                start: mulai,
                end: selesai,
                category: kategori
            };

            if (editIndex === -1) {
                kegiatanList.push(objekKegiatan);
            } else {
                kegiatanList[editIndex] = objekKegiatan;
                editIndex = -1;
            }

            localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
            form.reset();
            
            formTitleLabel.innerText = "+ Tambah / Kustomisasi Kegiatan";
            submitBtn.innerText = "Tambahkan ke Agenda";
            submitBtn.classList.replace('bg-emerald-700', 'bg-stone-900');
            submitBtn.classList.replace('hover:bg-emerald-800', 'hover:bg-stone-800');
            cancelEditBtn.classList.add('hidden');

            selectedDay = hari;
            activeDayLabel.innerText = hari;
            
            renderTabs();
            renderJadwal();
        });

        function hapusJadwal(originalIndex) {
            if (originalIndex > -1) {
                if (editIndex === originalIndex) {
                    batalEdit();
                }
                kegiatanList.splice(originalIndex, 1);
                localStorage.setItem('weekly_healthy_orange_jadwal', JSON.stringify(kegiatanList));
                renderJadwal();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = function() {
            renderTabs();
            renderJadwal();
            setInterval(cekWaktuOtomatis, 1000);
        };
    </script>
</body>
</html>
